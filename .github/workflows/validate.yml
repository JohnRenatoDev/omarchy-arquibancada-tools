name: Validate tools and theme distribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JohnRenatoDev/omarchy-arquibancada-theme
          path: theme
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate native theme and all club packages
        run: nice -n 19 python scripts/validate.py --theme-dir theme
      - name: Check Python sources
        run: nice -n 19 python -m compileall -q src scripts
      - name: Check native badge projection
        run: nice -n 19 python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check installer syntax
        run: bash -n install.sh
